# Master changelog: every schema change, in order. Liquibase records each applied changeset in
# DATABASECHANGELOG, so `update` only runs what is new. See ../README.md before adding a change.
databaseChangeLog:
  - include:
      file: changes/001-processed-upgrades.sql
      relativeToChangelogFile: true
  - include:
      file: changes/002-notification-outbox.sql
      relativeToChangelogFile: true
  - include:
      file: changes/003-drop-flyway-schema-history.sql
      relativeToChangelogFile: true
  - include:
      file: changes/004-outbox-id-allocated-in-blocks.sql
      relativeToChangelogFile: true
