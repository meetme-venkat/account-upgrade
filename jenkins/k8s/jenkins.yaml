# The Jenkins controller: one pod, its home (jobs, build history, the Maven cache) on a persistent volume, the UI at
# http://127.0.0.1:8090. Builds run in this pod and build images with the node's Docker engine, which the cluster
# runs them from (Rancher Desktop's moby engine), so no registry is involved.
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: jenkins
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
spec:
  serviceName: jenkins
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
    spec:
      serviceAccountName: jenkins
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Group of /var/run/docker.sock in Rancher Desktop's VM (docker, gid 101). Check with:
        #   rdctl shell ls -ln /var/run/docker.sock
        supplementalGroups: [101]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jenkins
          image: local/account-upgrade-jenkins:2.568.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: jenkins-settings
          env:
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-admin
                  key: password
            # The backend's tests start PostgreSQL and Kafka with Testcontainers on the node's Docker engine; their
            # published ports are on the node, not in this pod.
            - name: TESTCONTAINERS_HOST_OVERRIDE
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # The controller (25 % of this for its heap) plus Maven and the tests it runs.
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /var/jenkins_home
            - name: docker-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
