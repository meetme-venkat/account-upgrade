# Needs PostgreSQL and Kafka, and has no built-in addresses for them:
#  - deployed: set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD and SPRING_KAFKA_BOOTSTRAP_SERVERS
#    (plus SPRING_KAFKA_SECURITY_PROTOCOL=SSL for Amazon MSK with TLS);
#  - from source: `spring-boot:run` starts the containers in docker-compose.yml and connects to them;
#  - tests: Testcontainers provides both.
# Every other setting can be overridden the same way (e.g. UPGRADE_MESSAGING_PARTITIONS).
spring:
  application:
    name: account-upgrade-service
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    # Time each lifecycle phase (web server, Kafka listeners) gets to finish on shutdown.
    timeout-per-shutdown-phase: 30s

  # Processed requests and the notification outbox. The schema is created and migrated by the separate
  # account-update-db-schema service (Liquibase), which runs before this application starts.
  datasource:
    hikari:
      # Consumer threads + outbox relay + HTTP requests. Check PostgreSQL max_connections against replicas x pool.
      maximum-pool-size: 10
      # Fail fast when the database is down instead of stalling consumer threads.
      connection-timeout: 3000 # milliseconds (HikariCP does not accept duration strings)
      # Backstop against lock waits (e.g. two instances racing on the same event) and runaway queries.
      connection-init-sql: SET lock_timeout = '5s'; SET statement_timeout = '10s'
      data-source-properties:
        # Sends Hibernate's batched inserts (e.g. a batch's emails) as multi-row statements.
        reWriteBatchedInserts: true

  jpa:
    # No session held open across web requests: every database access happens in the services' transactions.
    open-in-view: false
    hibernate:
      # The schema belongs to account-update-db-schema (Liquibase). Hibernate only checks that the entities match it,
      # and refuses to start if they don't.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Inserts of many entities (a batch's emails) go to the database in groups of this size.
          batch_size: 50
        order_inserts: true

  kafka:
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Bounded blocking: the producer gives up before EventPublisherImpl stops waiting (10 s),
        # so a 503 means "not written" instead of "may still be written later".
        max.block.ms: 3000
        request.timeout.ms: 4000
        delivery.timeout.ms: 9000
    listener:
      # Commit the offsets once per poll, after its records are processed. A crash redelivers at most that poll's
      # records, which are skipped by event id (UpgradeRequestHandlerImpl). Per-record commits cost a broker round trip
      # per event: at 100,000 requests they took one broker to 1.5 cores and processing ran ~30 % slower
      # (deploy/load-test/peak-100k.md).
      ack-mode: batch
    consumer:
      group-id: upgrade-eligibility
      auto-offset-reset: earliest
      # Records per poll: the size of the batches KafkaUpgradeRequestListener processes in one transaction.
      # Override with SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS.
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080
  # Finish in-flight HTTP requests (and their Kafka publishes) before shutting down.
  shutdown: graceful

upgrade:
  security:
    # Login credentials of the single administrator. Override per environment with
    # UPGRADE_SECURITY_ADMIN_USERNAME / UPGRADE_SECURITY_ADMIN_PASSWORD (the prod profile warns about admin/admin).
    admin:
      username: admin
      password: admin
    jwt:
      # HMAC-SHA256 signing key, at least 32 bytes. Development only: the prod profile refuses to start with this
      # value. Set UPGRADE_SECURITY_JWT_SECRET, e.g. from `openssl rand -base64 48`.
      secret: ${UPGRADE_SECURITY_JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
      issuer: account-upgrade-backend
      token-ttl: 1h
  eligibility:
    min-age: 18
    max-age: 23
    min-balance: 30
  ingestion:
    max-request-size: 5MB
  messaging:
    # Topic names differ per environment: override with UPGRADE_MESSAGING_TOPICS_UPGRADE_REQUESTS (and
    # UPGRADE_MESSAGING_TOPICS_UPGRADE_REQUESTS_DLQ). The dead-letter queue follows the main topic by default.
    topics:
      upgrade-requests: upgrade-requests
      upgrade-requests-dlq: ${upgrade.messaging.topics.upgrade-requests}-dlq
    # Topic partitions: at least (max instances x consumer-concurrency). Partitions can only grow later.
    partitions: 4
    kafka:
      consumer-concurrency: 4
      # 1/1 suits a single development broker; production needs 3/2 (enforced by the prod profile).
      replication-factor: 1
      min-insync-replicas: 1
  notification:
    # Emails shown by GET /api/notifications.
    outbox-capacity: 1000
    relay:
      # How often each instance polls the outbox, and how many rows it claims per poll.
      interval: 500ms
      batch-size: 20
      max-attempts: 8
      retention: 7d
  web:
    cors:
      # Origins allowed to call /api directly from a browser (comma-separated).
      # Leave empty when the frontend proxies /api, as account-upgrade-frontend does.
      allowed-origins: ${UPGRADE_WEB_CORS_ALLOWED_ORIGINS:}

# The database is deliberately NOT part of the readiness group: an RDS blip must not take every instance
# out of the load balancer (ingestion only needs Kafka). Consumers retry instead.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
