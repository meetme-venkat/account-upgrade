# Production guardrail: the backend cannot merge unless tests, the coverage gate, the Maven
# enforcer rules and the container build all pass. See account-upgrade-backend/PRODUCTION_GUARDRAILS.md.
name: backend

on:
  push:
    branches: [main]
    paths: ['account-upgrade-backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['account-upgrade-backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: account-upgrade-backend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        java: ['17', '21']
    # Integration tests start their own PostgreSQL and Kafka containers (Testcontainers, runner's Docker).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Tests, coverage gate and enforcer rules
        run: ./mvnw -B verify
      - name: Coverage report
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: account-upgrade-backend/target/site/jacoco

  # The production image against the production-shaped stack (PostgreSQL + 3 Kafka brokers) from the root
  # docker-compose.yml: end-to-end flow, then the startup guardrail.
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL, Kafka x3 and the backend
        run: docker compose up -d --build postgres kafka-1 kafka-2 kafka-3 account-upgrade-backend
      - name: Backend becomes ready
        run: |
          for i in $(seq 1 90); do curl -fs http://localhost:8080/actuator/health/readiness && exit 0; sleep 2; done
          docker compose logs account-upgrade-backend; exit 1
      - name: Request flows through Kafka, PostgreSQL and the outbox relay
        run: |
          curl -fs -X POST http://localhost:8080/api/realtime-upgrade -H 'Content-Type: application/json' \
            -d '{"userId":"ci-e2e","userName":"Ci","age":20,"balance":50,"parentEmail":"p@example.com"}'
          for i in $(seq 1 60); do
            curl -fs 'http://localhost:8080/api/processed-upgrades?userId=ci-e2e' | tee result.json
            grep -q '"notificationSent":true' result.json && exit 0
            sleep 1
          done
          docker compose logs account-upgrade-backend; exit 1
      - name: Prod profile refuses topics that cannot survive a broker failure
        run: |
          if docker compose run --rm --no-deps -e UPGRADE_MESSAGING_KAFKA_REPLICATION_FACTOR=1 \
               account-upgrade-backend > startup.log 2>&1; then
            echo "Expected startup to fail"; exit 1
          fi
          grep -q "replication-factor must be at least 3" startup.log
      - name: Stop the stack
        if: always()
        run: docker compose down -v
