# Continuous delivery: every push to main is tested, built into images, scanned, published to GHCR and deployed
# to the local Rancher Desktop engine through a self-hosted runner. See deploy/README.md for the one-time setup.
#
#   push to main ─► backend CI ─┐
#                  frontend CI ─┴─► build + scan + push (per service) ─► deploy (self-hosted, Rancher Desktop)
#                                    ghcr.io/<owner>/<service>:<sha>      pull ─► compose up --wait ─► smoke test
#                                                                        └─ on failure: roll back to previous images
#
# Rollback / redeploy: run this workflow by hand from main with image_tag = an earlier commit SHA. Tests and build
# are skipped, and that commit's images and compose file are deployed.
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA (40 characters) of an already built release to redeploy. Empty = build and deploy main.
        required: false
        default: ''

permissions:
  contents: read

# One release at a time, and never cancel a deployment halfway. A newer push waits, and replaces any older pending run.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  backend-ci:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.image_tag == '')
    uses: ./.github/workflows/backend.yml

  frontend-ci:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.image_tag == '')
    uses: ./.github/workflows/frontend.yml

  build:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [account-upgrade-backend, account-upgrade-frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tag = full commit SHA (what gets deployed); "main" floats to the latest release.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Guardrail: nothing with a fixable critical vulnerability is published.
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Same build, fully cached, now pushed with an SBOM and build provenance attached.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

  deploy:
    needs: build
    # Runs after a successful build, or on its own for a manual redeploy of an earlier release.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.build.result == 'skipped'))
    runs-on: [self-hosted, windows, rancher-desktop]
    timeout-minutes: 20
    environment:
      name: rancher-desktop
      url: http://localhost:4200
    permissions:
      contents: read
      packages: read
    env:
      RELEASE: ${{ inputs.image_tag || github.sha }}
    defaults:
      run:
        # Windows' default execution policy blocks scripts; allow them for this process only.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Validate release
        run: |
          if ($env:RELEASE -notmatch '^[0-9a-f]{40}$') { throw "image_tag must be a full 40-character commit SHA, got '$env:RELEASE'" }

      # The release's own compose file, so the stack definition always matches its images.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy, smoke test, roll back on failure
        run: .\deploy\deploy.ps1 -Tag $env:RELEASE -Registry "ghcr.io/$($env:GITHUB_REPOSITORY_OWNER.ToLower())"
