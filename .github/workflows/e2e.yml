# Guardrail: the end-to-end tests cannot merge unless they compile and pass the Maven enforcer rules. They run
# against a live deployment (account-upgrade-e2e/README.md), so CI does not run them.
name: e2e

on:
  pull_request:
    paths: ['account-upgrade-e2e/**', '.github/workflows/e2e.yml']

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: account-upgrade-e2e

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile tests and enforcer rules
        run: ./mvnw -B -ntp verify -DskipTests
