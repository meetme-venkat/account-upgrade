# Full stack, production-shaped, on one machine:
#   docker compose up --build
#   UI:  http://localhost:4200     API: http://localhost:8080
#
# PostgreSQL + a 3-broker Kafka cluster (so topics get replication factor 3 / min.insync.replicas 2, which the
# backend's prod profile requires) + the three application services, started in order:
#   1. account-update-db-schema  Liquibase: brings the schema up to date, then exits (0 = success)
#   2. account-upgrade-backend   only after the schema job completed successfully
#   3. account-upgrade-frontend  only once the backend is healthy
# If the schema job fails, nothing after it starts. Each service can also be built and run on its own.
# The credentials below are for local use only.
# DB_SCHEMA_IMAGE / BACKEND_IMAGE / FRONTEND_IMAGE override the app images; the CD pipeline sets them to the registry images of the
# commit being deployed (see deploy/deploy.ps1). Unset, they fall back to the locally built images.
x-kafka: &kafka
  image: apache/kafka:3.9.1
  restart: unless-stopped
x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: account_upgrade
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

  account-update-db-schema:
    build: ./account-update-db-schema
    image: ${DB_SCHEMA_IMAGE:-account-update-db-schema:latest}
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/account_upgrade
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 256
    # A job: runs to completion on every deployment (a no-op when the schema is already current).
    restart: "no"

  account-upgrade-backend:
    build: ./account-upgrade-backend
    image: ${BACKEND_IMAGE:-account-upgrade-backend:latest}
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_upgrade
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      UPGRADE_MESSAGING_KAFKA_REPLICATION_FACTOR: "3"
      UPGRADE_MESSAGING_KAFKA_MIN_INSYNC_REPLICAS: "2"
      # Signs the login tokens. The prod profile refuses the development key from application.yml, so this stack
      # has its own; override with the environment variable for anything beyond local use.
      UPGRADE_SECURITY_JWT_SECRET: ${UPGRADE_SECURITY_JWT_SECRET:-local-compose-jwt-signing-key-not-for-production}
    depends_on:
      account-update-db-schema:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 512
    restart: unless-stopped

  account-upgrade-frontend:
    build: ./account-upgrade-frontend
    image: ${FRONTEND_IMAGE:-account-upgrade-frontend:latest}
    ports:
      - "4200:8080"
    environment:
      BACKEND_URL: http://account-upgrade-backend:8080
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    # Deployed last. (The frontend itself tolerates a missing backend: it shows "Backend down" until reachable.)
    depends_on:
      account-upgrade-backend:
        condition: service_healthy

volumes:
  postgres-data:
