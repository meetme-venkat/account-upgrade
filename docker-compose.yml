# Full stack, production-shaped, on one machine:
#   docker compose up --build
#   UI:  http://localhost:4200     API: http://localhost:8080
#
# PostgreSQL + a 3-broker Kafka cluster (so topics get replication factor 3 / min.insync.replicas 2, which the
# backend's prod profile requires) + backend + frontend. Each service can also be built and run on its own.
# The credentials below are for local use only.
# BACKEND_IMAGE / FRONTEND_IMAGE override the app images; the CD pipeline sets them to the registry images of the
# commit being deployed (see deploy/deploy.ps1). Unset, they fall back to the locally built images.
x-kafka: &kafka
  image: apache/kafka:3.9.1
  restart: unless-stopped
x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: account_upgrade
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

  account-upgrade-backend:
    build: ./account-upgrade-backend
    image: ${BACKEND_IMAGE:-account-upgrade-backend:latest}
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_upgrade
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      UPGRADE_MESSAGING_KAFKA_REPLICATION_FACTOR: "3"
      UPGRADE_MESSAGING_KAFKA_MIN_INSYNC_REPLICAS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 512
    restart: unless-stopped

  account-upgrade-frontend:
    build: ./account-upgrade-frontend
    image: ${FRONTEND_IMAGE:-account-upgrade-frontend:latest}
    ports:
      - "4200:8080"
    environment:
      BACKEND_URL: http://account-upgrade-backend:8080
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    # No depends_on: the frontend starts and serves the UI without the backend,
    # and shows "Backend down" until it is reachable.

volumes:
  postgres-data:
