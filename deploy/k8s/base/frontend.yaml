# account-upgrade-frontend: 2 replicas, zero-downtime rolling updates. Published on the host at port 4200.
apiVersion: v1
kind: Service
metadata:
  name: account-upgrade-frontend
  labels:
    app.kubernetes.io/name: account-upgrade-frontend
    app.kubernetes.io/component: frontend
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: account-upgrade-frontend
  ports:
    - name: http
      port: 4200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-upgrade-frontend
  labels:
    app.kubernetes.io/name: account-upgrade-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: account-upgrade-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-upgrade-frontend
        app.kubernetes.io/component: frontend
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: account-upgrade-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Fully qualified: nginx's resolver ignores the search domains of /etc/resolv.conf.
            - name: BACKEND_URL
              value: http://account-upgrade-backend.account-upgrade.svc.cluster.local:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: account-upgrade-frontend
  labels:
    app.kubernetes.io/name: account-upgrade-frontend
    app.kubernetes.io/component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: account-upgrade-frontend
