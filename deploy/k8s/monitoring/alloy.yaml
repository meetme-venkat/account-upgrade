# Grafana Alloy: ships the logs of every pod in account-upgrade to Loki and Splunk. It reads them through the Kubernetes API
# (loki.source.kubernetes) instead of the nodes' log files, so it needs no host access, and it may only list pods and
# read their logs in that one namespace (a Role, not a ClusterRole).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-log-reader
  namespace: account-upgrade
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: monitoring
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-log-reader
  namespace: account-upgrade
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-log-reader
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // Every pod of the platform, with its app, component and container as labels.
    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        names = ["account-upgrade"]
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label  = "component"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.levels.receiver]
    }

    // The backend logs JSON (ECS): its level becomes a label, so errors can be selected without parsing every line.
    // Other lines (Kafka, PostgreSQL, nginx) pass through unchanged.
    loki.process "levels" {
      stage.json {
        expressions = { level = "log.level" }
      }
      stage.labels {
        values = { level = "" }
      }
      forward_to = [loki.write.loki.receiver, otelcol.receiver.loki.splunk.receiver]
    }

    // The same lines to Splunk's HTTP Event Collector, with the labels (app, pod, level...) as indexed fields.
    // Independent of Loki: if Splunk is down, its queue fills and drops, and Loki keeps receiving.
    otelcol.receiver.loki "splunk" {
      output {
        logs = [otelcol.processor.batch.splunk.input]
      }
    }

    otelcol.processor.batch "splunk" {
      output {
        logs = [otelcol.exporter.splunkhec.splunk.input]
      }
    }

    // A community component (enabled by --feature.community-components.enabled).
    otelcol.exporter.splunkhec "splunk" {
      client {
        endpoint = "https://splunk-hec.monitoring.svc.cluster.local:8088/services/collector"
        // Splunk's HEC certificate is self-signed; the traffic stays inside the cluster.
        insecure_skip_verify = true
      }
      splunk {
        token      = sys.env("SPLUNK_HEC_TOKEN")
        index      = "main"
        source     = "account-upgrade"
        // Plain text, for every line: Splunk still extracts the fields of the backend's JSON lines at search time
        // (AUTO_KV_JSON). Not _json: Splunk parses that when indexing and drops every line that isn't JSON (Kafka,
        // PostgreSQL, nginx).
        sourcetype = "kube:container"
      }
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alloy-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
spec:
  # One collector: two would ship every line twice (loki.source.kubernetes has no sharding without clustering).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      enableServiceLinks: false
      securityContext:
        # The image defaults to root; nothing here needs it.
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --disable-reporting
            - --feature.community-components.enabled
          env:
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: splunk
                  key: hec-token
          ports:
            - name: http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            # How far each pod's log has been read, on a volume: a new Alloy pod resumes there. With an emptyDir, every
            # restart re-sent every running pod's whole log (the 100,000-request soak's lines landed twice in Splunk).
            - name: data
              mountPath: /var/lib/alloy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          persistentVolumeClaim:
            claimName: alloy-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
