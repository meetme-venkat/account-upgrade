# Metrics, logs and dashboards for the Account Upgrade platform: Prometheus, Loki, Alloy and Grafana in "monitoring",
# and two exporters next to what they watch in "account-upgrade" (Kafka consumer lag, PostgreSQL activity).
# Install or update with deploy/k8s/monitoring/install.sh; see README.md. Independent of the application's
# pipeline: the platform runs the same with or without it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: account-upgrade-monitoring
    includeSelectors: false

resources:
  - namespace.yaml
  - exporters.yaml
  - prometheus.yaml
  - loki.yaml
  - alloy.yaml
  - grafana.yaml

configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - dashboards/account-upgrade.json
generatorOptions:
  # A fixed name: Grafana's Deployment mounts it, and Grafana reloads provisioned dashboards by itself.
  disableNameSuffixHash: true
